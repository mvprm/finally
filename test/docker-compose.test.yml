# E2E stack: the FinAlly app (mock LLM, fresh in-memory database) + a Playwright runner.
#
# Run from the repo root:
#   docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
#   docker compose -f test/docker-compose.test.yml down -v
# or use test/run_e2e.sh / test/run_e2e.ps1, which do both.
#
# The HTML report is written to test/playwright-report/ on the host.
name: finally-e2e

services:
  # Not called "app": Chromium force-upgrades http://app/ to HTTPS (".app" is an HSTS-preloaded TLD).
  finally:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finally:e2e
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      DB_PATH: /app/db/finally.db
    # tmpfs: every `up` starts with an empty database (no leftover state between runs)
    tmpfs:
      - /app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    depends_on:
      finally:
        condition: service_healthy
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    volumes:
      - ./:/e2e
      # Keep the container's Linux node_modules separate from any host install
      - /e2e/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    ipc: host
